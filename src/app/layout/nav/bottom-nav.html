<nav [attr.aria-label]="'nav.mainLabel' | t">
  @for (item of primary; track item.path) {
    <a class="item" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
       #rla="routerLinkActive">
      <span class="indicator">
        <mat-icon [class.app-icon-filled]="rla.isActive" aria-hidden="true">{{ item.icon }}</mat-icon>
      </span>
      <span class="label">{{ item.labelKey | t }}</span>
    </a>
  }
  <button type="button" class="item" [class.active]="moreActive()" [matMenuTriggerFor]="more">
    <span class="indicator">
      <mat-icon [matBadge]="badge()" matBadgeSize="small" [matBadgeHidden]="alerts.count() === 0"
                aria-hidden="true">more_horiz</mat-icon>
    </span>
    <span class="label">{{ 'nav.more' | t }}</span>
    @if (alerts.count() > 0) {
      <span class="app-visually-hidden">({{ 'nav.notifications.button' | t: { count: alerts.count() } }})</span>
    }
  </button>
</nav>

<mat-menu #more="matMenu" yPosition="above" xPosition="before">
  @for (item of secondary; track item.path) {
    <a mat-menu-item [routerLink]="item.path" routerLinkActive="app-menu-item-active" ariaCurrentWhenActive="page">
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span>{{ item.labelKey | t }}</span>
      @if (item.alertsBadge && alerts.count() > 0) {
        <span class="app-menu-count">{{ badge() }}</span>
      }
    </a>
  }
  <mat-divider />
  <button mat-menu-item type="button" (click)="theme.cycle()">
    <mat-icon aria-hidden="true">{{ themeIcons[theme.theme()] }}</mat-icon>
    <span>{{ themeLabel() }}</span>
  </button>
  <button mat-menu-item type="button" (click)="auth.logout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    <span>{{ 'nav.user.logout' | t }}</span>
  </button>
</mat-menu>
