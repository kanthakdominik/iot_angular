<div class="login-container">
    <div class="login-box">
        <h2 class="text-center mb-4">Login</h2>

        @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group mb-3">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username"
                    [(ngModel)]="credentials.username" #username="ngModel" required [disabled]="loading">
                @if (username.invalid && (username.dirty || username.touched)) {
                    <div class="text-danger small mt-1">Username is required</div>
                }
            </div>

            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password"
                    [(ngModel)]="credentials.password" #password="ngModel" required [disabled]="loading">
                @if (password.invalid && (password.dirty || password.touched)) {
                    <div class="text-danger small mt-1">Password is required</div>
                }
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading || !loginForm.form.valid">
                @if (loading) {
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                }
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>
        </form>
    </div>
</div>
